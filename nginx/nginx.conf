worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location /health {
            default_type text/plain;
            return 200 "API Gateway do Portal B2B ativo\n";
        }

        location /pgadmin/ {
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_pass http://pgadmin:80/;
            proxy_redirect off;
        }

        location /api/usuarios/ {
            proxy_pass http://host.docker.internal:5001/;
        }

        location /api/produtos/ {
            proxy_pass http://host.docker.internal:5002/;
        }

        location /produtos/ {
            proxy_pass http://host.docker.internal:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/fornecimentos/ {
            proxy_pass http://host.docker.internal:5003/;
        }

        location /api/demandas/ {
            proxy_pass http://host.docker.internal:5004/;
        }

        location /api/mercado/ {
            proxy_pass http://host.docker.internal:5005/;
        }

        location /api/negociacoes/ {
            proxy_pass http://host.docker.internal:5006/;
        }

        location /api/pedidos/ {
            proxy_pass http://host.docker.internal:5007/;
        }

        location /api/logistica/ {
            proxy_pass http://host.docker.internal:5008/;
        }

        location /logistica/ {
            proxy_pass http://host.docker.internal:8088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /demandas/ {
            proxy_pass http://host.docker.internal:8084/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://host.docker.internal:8082/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
