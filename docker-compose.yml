version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: portal-b2b-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_b2b}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - portal-b2b-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: portal-b2b-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@portalb2b.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - portal-b2b-network
    depends_on:
      - postgres

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: portal-b2b-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${REDPANDA_EXTERNAL_HOST:-localhost}:${REDPANDA_PORT:-9092}
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "${REDPANDA_PORT:-9092}:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - portal-b2b-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: portal-b2b-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./redpanda/create-topics.sh:/create-topics.sh
    entrypoint: [ "bash", "/create-topics.sh" ]
    networks:
      - portal-b2b-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: portal-b2b-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: portal-b2b-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
    networks:
      - portal-b2b-network
    depends_on:
      - redpanda

  nginx-gateway:
    image: nginx:alpine
    container_name: portal-b2b-nginx-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - portal-b2b-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  portal-b2b-network:
    name: portal-b2b-network
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redpanda_data:
